<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borboletas Mágicas em Círculo</title>
    <!-- Vincula o arquivo de estilos -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botão de Gravação -->
    <button class="btn-gravar" id="btnGravar" onclick="controlarGravacao()">GRAVAR VÍDEO</button>
 <button class="play" id="play_music">OUVIR MÚSICA</button>

    <!-- Elemento de Áudio Oculto (Substitua musica.mp3 pelo seu arquivo) -->
    <audio id="musicaFundo" src="Revolutionary.mp3" loop></audio>


    <!-- Elemento da Flor Central -->
    <div class="flor-centro" id="flor">
        <div class="petala-grupo externa">
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
        </div>
        <div class="petala-grupo interna">
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
        </div>
        <div class="miolo"></div>
    </div>

    <!-- Vincula o arquivo de animação e lógica -->
    <script src="script.js"></script>
</body>
</html>
