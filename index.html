<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borboleta Animada</title>
    <style>
        /* === ESTILO CSS === */
        body {
            margin: 0;
            height: 100vh;
            background-color: #1a1a1a;
            overflow: hidden;
            perspective: 1000px; /* Cria o efeito de profundidade 3D */
        }

        .borboleta {
            position: absolute;
            width: 40px;
            height: 40px;
            transform-style: preserve-3d;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Evita que o mouse trave ao clicar na borboleta */
            left: 50%; /* Posição inicial centralizada */
            top: 50%;
        }

        .corpo {
            position: absolute;
            top: 10px;
            left: 18px;
            width: 4px;
            height: 20px;
            background: #ffffff; /* Corpo branco para contrastar com o fundo */
            border-radius: 2px;
            z-index: 2;
        }

        .asa {
            position: absolute;
            width: 25px;
            height: 35px;
            /* Desenho da asa em formato SVG embutido */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 20 30"><path d="M20,30 C10,30 0,20 0,10 C0,0 10,0 20,10 Z" fill="%23ff007f"/></svg>');
            background-repeat: no-repeat;
            background-size: contain;
        }

        .asa.esquerda {
            left: -5px;
            transform-origin: right center;
            animation: baterEsquerda 0.15s infinite alternate ease-in-out;
        }

        .asa.direita {
            right: -5px;
            transform-origin: left center;
            animation: baterDireita 0.15s infinite alternate ease-in-out;
        }

        /* Animações de bater de asas em 3D usando o eixo Y */
        @keyframes baterEsquerda {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(75deg); }
        }

        @keyframes baterDireita {
            0% { transform: scaleX(-1) rotateY(0deg); }
            100% { transform: scaleX(-1) rotateY(75deg); }
        }
    </style>
</head>
<body>

    <!-- === ESTRUTURA HTML === -->
    <div class="borboleta" id="borboleta">
        <div class="asa esquerda"></div>
        <div class="corpo"></div>
        <div class="asa direita"></div>
    </div>

    <!-- === COMPORTAMENTO JAVASCRIPT === -->
    <script>
        const borboleta = document.getElementById('borboleta');

        document.addEventListener('mousemove', (e) => {
            // Atualiza a posição da borboleta seguindo as coordenadas do mouse
            borboleta.style.left = e.clientX + 'px';
            borboleta.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
