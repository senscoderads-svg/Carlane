<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borboletas Mágicas em Círculo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Botões de Controle e Playlist -->
    <div class="controles-container">
        <button class="btn-gravar" id="btnGravar" onclick="controlarGravacao()">GRAVAR VÍDEO</button>
        <button class="play" id="play_revolutionary">OUVIR REVOLUTIONARY</button>
        <button class="play" id="play_amen">OUVIR AMEN</button>
    </div>

    <!-- Elementos de Áudio -->
    <audio id="musicaRevolutionary" src="Revolutionary.mp3" loop></audio>
    <audio id="musicaAmen" src="amen.mp3" loop></audio> 

    <!-- Elemento da Flor Central -->
    <div class="flor-centro" id="flor">
        <div class="petala-grupo externa">
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
        </div>
        <div class="petala-grupo interna">
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
            <div class="petala"></div><div class="petala"></div><div class="petala"></div><div class="petala"></div>
        </div>
        <div class="miolo"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
